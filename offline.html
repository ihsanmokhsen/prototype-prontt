<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0099DD">
  <title>PRO NTT — Offline</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#f3f7fb;color:#10243a;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    img{width:88px;height:88px;border-radius:20px;margin-bottom:20px}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#395066;margin:0 0 24px;line-height:1.5}
    button{background:#0099DD;color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:600}
  </style>
</head>
<body>
  <div>
    <img src="img/icons/icon-192.png" alt="">
    <h1>Tidak ada koneksi internet</h1>
    <p>Periksa jaringan Anda, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
