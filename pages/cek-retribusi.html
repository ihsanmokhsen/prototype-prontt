<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cek &amp; Bayar Retribusi — PRO NTT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <section class="screen active" id="cekretribusi">
    <div class="scroll">
      <div class="appbar">
        <button class="back" onclick="location.href='retribusi.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div><h1>Cek &amp; Bayar Retribusi</h1><div class="sub">Masukkan ID penyewa</div></div>
      </div>
      <div class="section" style="padding-top:8px">
        <div class="field">
          <label class="label">ID Penyewa</label>
          <input class="inp text-left" id="ck-idsewa" placeholder="Contoh: PW-001" autocomplete="off" onkeydown="if(event.key==='Enter')cekRetribusi()">
          <div class="hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg>
            <span>ID penyewa tercantum pada SK / Perjanjian Kerjasama.</span>
          </div>
        </div>
        <div class="section-title" style="margin-top:6px">ID penyewa contoh presentasi</div>
        <div class="section-sub" style="margin-bottom:10px">Ketuk ID untuk mengisi kolom:</div>
        <div id="ck-samples" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <div class="pad"></div>
    </div>
    <div class="footer-cta">
      <button class="btn btn-blue" onclick="cekRetribusi()">Cek Tagihan</button>
    </div>
  </section>

  <script src="../js/data.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/retribusi.js"></script>
</body>
</html>
