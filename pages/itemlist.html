<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daftar Item — PRO NTT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <section class="screen active" id="itemlist">
    <div class="scroll">
      <div class="appbar">
        <button class="back" onclick="location.href='retribusi.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div><h1 id="il-title">Daftar Item</h1><div class="sub" id="il-sub">Retribusi Daerah</div></div>
      </div>
      <div class="section" style="padding-top:4px">
        <div class="filterbar">
          <input class="inp text-left" id="il-search" placeholder="Cari item, lokasi, atau kode…" autocomplete="off" oninput="applyFilter()">
          <div class="filters" id="il-filters"></div>
          <div class="fcount" id="il-count"></div>
        </div>
        <div class="ilist" id="item-list"></div>
        <div class="empty" id="il-empty" hidden>
          <div class="t">Tidak ada item</div>
          <div class="d">Coba ubah kata kunci atau filter yang dipilih.</div>
        </div>
      </div>
      <div class="pad"></div>
    </div>
    <nav class="tabbar" data-tabbar></nav>
  </section>

  <script src="../js/data.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/retribusi.js"></script>
</body>
</html>
