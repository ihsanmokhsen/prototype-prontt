<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pembayaran Berhasil — PRO NTT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <section class="screen active" id="sukses">
    <div class="scroll">
      <div class="check"><div class="inner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div></div>
      <h2>Pembayaran Berhasil</h2>
      <p id="sukses-sub">Retribusi telah dibayar.</p>
      <div class="receipt">
        <div class="rr"><span class="k">Jenis</span><span class="v" id="rc-jenis">Retribusi</span></div>
        <div class="rr"><span class="k">Metode</span><span class="v" id="rc-metode">QRIS</span></div>
        <div class="rr"><span class="k">No. Referensi</span><span class="v" id="rc-ref">PRONTT-2026021847</span></div>
        <div class="rr" style="border-top:1px dashed var(--line);margin-top:4px;padding-top:12px"><span class="k">Total</span><span class="v" id="rc-total" style="color:var(--blue-700);font-size:16px">Rp 0</span></div>
      </div>
      <button class="btn btn-blue" id="rc-back" onclick="location.href='../index.html#dashboard'">Kembali ke Beranda</button>
      <div style="height:10px"></div>
      <button class="btn" style="background:var(--blue-50);color:var(--blue-600)" onclick="location.href='../index.html#riwayat'">Lihat di Riwayat</button>
    </div>
  </section>

  <script src="../js/data-lokal.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/retribusi.js"></script>
</body>
</html>
