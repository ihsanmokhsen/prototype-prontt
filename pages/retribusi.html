<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retribusi — PRO NTT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <section class="screen active" id="retribusi">
    <div class="app-header"><div class="brand"><div class="brand-text"><div class="brand-name">Pro <span>NTT</span></div><div class="brand-tag">Pajak dan Retribusi Online</div></div><img class="brand-emblem" src="../img/lambang-ntt.jpg" alt="Lambang Provinsi NTT"></div></div>
    <div class="scroll">
      <div class="page-title">Retribusi</div>
      <div class="section" style="padding-top:8px">
        <div class="cat">
          <div class="ct"><span class="bar"></span>LAYANAN</div>
          <div class="menucard" style="border-radius:var(--r-sm);margin-bottom:0">
            <div class="mitem" onclick="location.href='cek-retribusi.html'">
              <div class="ic blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg></div>
              <div class="mt">Cek &amp; Bayar Retribusi</div>
              <div class="ch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
            </div>
          </div>
        </div>
        <div class="cat">
          <div class="ct"><span class="bar"></span>SEWA</div>
          <div class="cat-grid">
            <div class="citem" onclick="goList('gedung')"><img src="https://app.iwana.id/assets/prontt/icon/SEWA%20GEDUNG.png" style="width:70px;height:70px;object-fit:contain"><span>Gedung</span></div>
            <div class="citem" onclick="goList('tanah')"><img src="https://app.iwana.id/assets/prontt/icon/SEWA%20TANAH.png" style="width:70px;height:70px;object-fit:contain"><span>Tanah</span></div>
            <div class="citem" onclick="goList('labkesehatan')"><img src="https://app.iwana.id/assets/prontt/icon/SEWA%20PERALATAN%20LEB.png" style="width:70px;height:70px;object-fit:contain"><span>Peralatan Penelitian Kesehatan</span></div>
            <div class="citem" onclick="goList('it')"><img src="https://app.iwana.id/assets/prontt/icon/SEWA%20PERALATAN%20IT.png" style="width:70px;height:70px;object-fit:contain"><span>Peralatan IT</span></div>
          </div>
        </div>
        <div class="cat">
          <div class="ct"><span class="bar"></span>TERNAK</div>
          <div class="cat-grid">
            <div class="citem" onclick="goList('ternak')"><img src="https://app.iwana.id/assets/prontt/icon/TERNAK.png" style="width:70px;height:70px;object-fit:contain"><span>Ternak</span></div>
            <div class="citem" onclick="goList('pakan')"><img src="https://app.iwana.id/assets/prontt/icon/PEMERIKSAAN%20HEWAN.png" style="width:70px;height:70px;object-fit:contain"><span>Pakan Ternak</span></div>
            <div class="citem" onclick="goList('labhewan')"><img src="https://app.iwana.id/assets/prontt/icon/PAKAN.png" style="width:70px;height:70px;object-fit:contain"><span>Pemeriksaan Laboratorium Hewan</span></div>
          </div>
        </div>
        <div class="cat">
          <div class="ct"><span class="bar"></span>JASA KESEHATAN</div>
          <div class="cat-grid">
            <div class="citem" onclick="goList('kesehatan')"><img src="https://app.iwana.id/assets/prontt/icon/PEMERIKSAAN%20KESEHATAN.png" style="width:70px;height:70px;object-fit:contain"><span>Pemeriksaan Kesehatan</span></div>
            <div class="citem" onclick="goList('klinik')"><img src="https://app.iwana.id/assets/prontt/icon/PEMERIKSAAN%20KESEHATAN.png" style="width:70px;height:70px;object-fit:contain"><span>Jasa Laboratorium</span></div>
            <div class="citem" onclick="goList('kesehatan')"><img src="https://app.iwana.id/assets/prontt/icon/PEMERIKSAAN%20KESEHATAN.png" style="width:70px;height:70px;object-fit:contain"><span>Pelayanan Jasa Laboratorium</span></div>
          </div>
        </div>
      </div>
      <div class="pad"></div>
    </div>
    <nav class="tabbar" data-tabbar></nav>
  </section>

  <script src="../js/data-lokal.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/retribusi.js"></script>
</body>
</html>
